name: Morning recording

on:
  schedule:
    # 01:35 UTC is 07:05 IST. The job waits until 07:10, then records 15 minutes.
    - cron: "35 1 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Length of a test recording, in seconds
        required: false
        default: "30"

concurrency:
  group: morning-recording
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Record
        run: npm run record
        env:
          RECORD_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seconds || '900' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
          WAIT_FOR_WINDOW: ${{ github.event_name == 'schedule' && '1' || '0' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
